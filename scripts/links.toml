[discovery]
autolink_dirs = ["home/.config", "home/.local", "home/.glzr"]
# noctty is Windows-only; it is linked explicitly in the Windows-only section
# because it needs the additional %LOCALAPPDATA% target.
exclude = ["home/.config/noctty"]

[[links]]
key = "zshrc"
source = "home/.zshrc"
target = "{HOME}/.zshrc"

[[links]]
key = "taskrc"
source = "home/.config/task/taskrc"
target = "{HOME}/.taskrc"

[[links]]
key = "oooconf-bin"
source = "home/.config/ooodnakov/bin/oooconf"
target = "{LOCAL_BIN}/oooconf"

[[links]]
key = "o-bin"
source = "home/.config/ooodnakov/bin/o"
target = "{LOCAL_BIN}/o"

[[links]]
key = "pi"
source = "home/.pi"
target = "{HOME}/.pi"

[[links]]
key = "pi-lens"
source = "home/.pi-lens"
target = "{HOME}/.pi-lens"

[[links]]
key = "omp-config"
source = "home/.omp/agent/config.yml"
target = "{HOME}/.omp/agent/config.yml"

[[links]]
key = "omp-themes"
source = "home/.omp/agent/themes"
target = "{HOME}/.omp/agent/themes"

[[links]]
key = "omp-skills"
source = "home/.omp/agent/skills"
target = "{HOME}/.omp/agent/skills"

[[links]]
key = "omp-mcp"
source = "home/.omp/agent/mcp.json"
target = "{HOME}/.omp/agent/.mcp.json"

[[links]]
key = "omp-vibes"
source = "home/.omp/agent/vibes"
target = "{HOME}/.omp/agent/vibes"

[[links]]
key = "omp-rtk"
source = "home/.omp/extensions/rtk.ts"
target = "{HOME}/.omp/extensions/rtk.ts"

[[links]]
key = "omp-keybinds"
source = "home/.omp/agent/keybindings.yml"
target = "{HOME}/.omp/agent/keybindings.yml"

# --- linux-only ---

[[links]]
key = "hypr"
source = "home/.config/hypr"
target = "{CONFIG_HOME}/hypr"
only = "linux"

[[links]]
key = "pypr"
source = "home/.config/pypr"
target = "{CONFIG_HOME}/pypr"
only = "linux"

[[links]]
key = "noctalia"
source = "home/.config/noctalia"
target = "{CONFIG_HOME}/noctalia"
only = "linux"

# --- macos-only ---

[[links]]
key = "aerospace"
source = "home/.config/aerospace"
target = "{CONFIG_HOME}/aerospace"
only = "macos"

[[links]]
key = "omniwm"
source = "home/.config/omniwm"
target = "{CONFIG_HOME}/omniwm"
only = "macos"

[[links]]
key = "borders"
source = "home/.config/borders"
target = "{CONFIG_HOME}/borders"
only = "macos"

[[links]]
key = "sketchybar"
source = "home/.config/sketchybar"
target = "{CONFIG_HOME}/sketchybar"
only = "macos"

# --- Windows-only ---

# noctty reads $XDG_CONFIG_HOME/noctty/config.ghostty when XDG_CONFIG_HOME is
# set, and %LOCALAPPDATA%\noctty\config.ghostty otherwise. Link both so shells
# and Explorer launches share the repo-managed file.
[[links]]
key = "noctty-config"
source = "home/.config/noctty"
target = "{CONFIG_HOME}/noctty"
only = "windows"

[[links]]
key = "noctty-localappdata"
source = "home/.config/noctty/config.ghostty"
target = "{HOME}/AppData/Local/noctty/config.ghostty"
only = "windows"

[[links]]
key = "gitbash-bashrc"
source = "home/.bashrc"
target = "{HOME}/.bashrc"
only = "windows"

[[links]]
key = "gitbash-bash-profile"
source = "home/.bash_profile"
target = "{HOME}/.bash_profile"
only = "windows"

[[links]]
key = "gitbash-minttyrc"
source = "home/.minttyrc"
target = "{HOME}/.minttyrc"
only = "windows"

[[links]]
key = "komorebi-config"
source = "home/.config/komorebi/komorebi.json"
target = "{HOME}/komorebi.json"
only = "windows"

[[links]]
key = "komorebi-bar"
source = "home/.config/komorebi/komorebi.bar.json"
target = "{HOME}/komorebi.bar.json"
only = "windows"

[[links]]
key = "komorebi-apps"
source = "home/.config/komorebi/applications.json"
target = "{HOME}/applications.json"
only = "windows"

[[links]]
key = "whkdrc"
source = "home/.config/komorebi/whkdrc"
target = "{CONFIG_HOME}/whkdrc"
only = "windows"

[[links]]
key = "glazewm"
source = "home/.glzr/glazewm"
target = "{HOME}/.glzr/glazewm"
only = "windows"

[[links]]
key = "zebar"
source = "home/.glzr/zebar"
target = "{HOME}/.glzr/zebar"
only = "windows"
