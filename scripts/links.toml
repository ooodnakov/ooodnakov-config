[discovery]
autolink_dirs = ["home/.config", "home/.local", "home/.glzr"]
# noctty is Windows-only; it is linked explicitly in the Windows-only section
# because it needs the additional %LOCALAPPDATA% target.
# herdr-app writes its own runtime state into ~/.config/herdr-app (frame/,
# icons/, layouts/.state/, view.json, *.sock), so only the settings and theme
# files this repo owns are linked, never the whole folder.
exclude = ["home/.config/noctty", "home/.config/herdr-app"]

[[links]]
key = "zshrc"
source = "home/.zshrc"
target = "{HOME}/.zshrc"

[[links]]
key = "taskrc"
source = "home/.config/task/taskrc"
target = "{HOME}/.taskrc"

[[links]]
key = "oooconf-bin"
source = "home/.config/ooodnakov/bin/oooconf"
target = "{LOCAL_BIN}/oooconf"

[[links]]
key = "o-bin"
source = "home/.config/ooodnakov/bin/o"
target = "{LOCAL_BIN}/o"

[[links]]
key = "pi"
source = "home/.pi"
target = "{HOME}/.pi"

[[links]]
key = "pi-lens"
source = "home/.pi-lens"
target = "{HOME}/.pi-lens"

[[links]]
key = "omp-config"
source = "home/.omp/agent/config.yml"
target = "{HOME}/.omp/agent/config.yml"

[[links]]
key = "omp-themes"
source = "home/.omp/agent/themes"
target = "{HOME}/.omp/agent/themes"

# Skills shared by every agent live under
# home/.config/ooodnakov/agents/skills/ and are linked by
# `oooconf agents skills sync` (installer = "local" in common-data.json).
# OMP-only skills stay in home/.omp/agent/skills/.
[[links]]
key = "omp-skill-impeccable"
source = "home/.omp/agent/skills/impeccable"
target = "{HOME}/.omp/agent/skills/impeccable"

[[links]]
key = "omp-mcp"
source = "home/.omp/agent/mcp.json"
target = "{HOME}/.omp/agent/.mcp.json"

[[links]]
key = "omp-vibes"
source = "home/.omp/agent/vibes"
target = "{HOME}/.omp/agent/vibes"

[[links]]
key = "omp-rtk"
source = "home/.omp/extensions/rtk.ts"
target = "{HOME}/.omp/extensions/rtk.ts"

# herdr-app: the folder is excluded from autolink (see [discovery]); link the
# files this repo owns. `theme` in settings.json names the managed themes.
[[links]]
key = "herdr-settings"
source = "home/.config/herdr-app/settings.json"
target = "{CONFIG_HOME}/herdr-app/settings.json"

# The managed key bindings (a copy of the live file plus the panel keys).
[[links]]
key = "herdr-keys"
source = "home/.config/herdr-app/keys.json"
target = "{CONFIG_HOME}/herdr-app/keys.json"

[[links]]
key = "herdr-theme-gruvbox-dark"
source = "home/.config/herdr-app/themes/gruvbox-dark.json"
target = "{CONFIG_HOME}/herdr-app/themes/gruvbox-dark.json"

[[links]]
key = "herdr-theme-gruvbox-light"
source = "home/.config/herdr-app/themes/gruvbox-light.json"
target = "{CONFIG_HOME}/herdr-app/themes/gruvbox-light.json"

# The managed Tasks/Artifacts panels, the agent panel's header, and the layout
# that places them.
[[links]]
key = "herdr-mod-oo-tasks"
source = "home/.config/herdr-app/mods/oo-tasks"
target = "{CONFIG_HOME}/herdr-app/mods/oo-tasks"

[[links]]
key = "herdr-mod-oo-artifacts"
source = "home/.config/herdr-app/mods/oo-artifacts"
target = "{CONFIG_HOME}/herdr-app/mods/oo-artifacts"

[[links]]
key = "herdr-mod-oo-agent-head"
source = "home/.config/herdr-app/mods/oo-agent-head"
target = "{CONFIG_HOME}/herdr-app/mods/oo-agent-head"

[[links]]
key = "herdr-mod-tabs-panels"
source = "home/.config/herdr-app/mods/tabs-panels"
target = "{CONFIG_HOME}/herdr-app/mods/tabs-panels"

[[links]]
key = "herdr-layout-tasks"
source = "home/.config/herdr-app/layouts/tasks.json"
target = "{CONFIG_HOME}/herdr-app/layouts/tasks.json"

[[links]]
key = "herdr-layout-tasks-preview"
source = "home/.config/herdr-app/layouts/tasks.svg"
target = "{CONFIG_HOME}/herdr-app/layouts/tasks.svg"

# A clone of Herdr's `main` with Tasks and Artifacts added to its panel stack;
# its tab bar is the repo-owned tabs-panels clone, whose buttons open them.
[[links]]
key = "herdr-layout-main-panels"
source = "home/.config/herdr-app/layouts/main-panels.json"
target = "{CONFIG_HOME}/herdr-app/layouts/main-panels.json"

[[links]]
key = "herdr-layout-main-panels-preview"
source = "home/.config/herdr-app/layouts/main-panels.svg"
target = "{CONFIG_HOME}/herdr-app/layouts/main-panels.svg"

# `herdr-task` and `herdr-artifact`, which agents and people run: one entry
# each, in ~/.local/bin beside oooconf. Plain POSIX scripts (Python 3.8+).
[[links]]
key = "herdr-task"
source = "home/.config/ooodnakov/bin/herdr-task"
target = "{LOCAL_BIN}/herdr-task"

[[links]]
key = "herdr-artifact"
source = "home/.config/ooodnakov/bin/herdr-artifact"
target = "{LOCAL_BIN}/herdr-artifact"

# --- linux-only ---

[[links]]
key = "hypr"
source = "home/.config/hypr"
target = "{CONFIG_HOME}/hypr"
only = "linux"

[[links]]
key = "pypr"
source = "home/.config/pypr"
target = "{CONFIG_HOME}/pypr"
only = "linux"

[[links]]
