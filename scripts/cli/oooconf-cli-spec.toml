[meta]
schema_version = 1
minimum_reader_version = 1

[global]
options = { "--all" = "select all dependency keys at once", "--skip-deps" = "skip dependency installation", "-C" = "set repo root path", "--repo-root" = "set repo root path", "--profile" = "select portable capability profile", "--print-repo-root" = "print resolved repo root", "-h" = "show help", "--help" = "show help", "-n" = "preview actions without changing files", "--dry-run" = "preview actions without changing files", "--yes-optional" = "auto-confirm optional dependency installs", "-V" = "show version", "--version" = "show version" }
completers = { "-C" = "_files -/", "--repo-root" = "_files -/" }
option_value_sets = { "--profile" = "profiles" }

[definitions.deps_keys]

[definitions.regions]
"global" = "global"
china = "china"

[definitions.secret_shells]
sh = "sh"
zsh = "zsh"
bash = "bash"
pwsh = "pwsh"
fish = "fish"

[definitions.secret_methods]
auto = "auto"
password = "password"
apikey = "apikey"

[definitions.secret_backends]
bw = "bw"

[definitions.plan_formats]
text = "human-readable plan"
json = "versioned JSON plan"

[definitions.diagnostic_formats]
text = "human-readable checks"
json = "versioned diagnostic JSON"

[definitions.plan_scopes]
install = "complete install plan"
links = "managed links only"

[definitions.platforms]
linux = "Linux"
macos = "macOS"
windows = "Windows"

[definitions.profiles]
minimal = "portable shell and CLI baseline"
terminal = "minimal plus terminal productivity tools"
workstation = "terminal plus platform desktop integrations"
developer = "terminal plus development and agent tooling"

[commands.bootstrap]
handler_id = "oooconf.bootstrap"
platforms = ["linux", "macos"]
description = "clone or update the repo, then run install"

[commands.install]
handler_id = "oooconf.install"
platforms = ["linux", "macos", "windows"]
description = "apply managed config"
options = { "--dry-run" = "preview actions without changing files", "--yes-optional" = "auto-confirm optional dependency installs", "--skip-deps" = "skip dependency installation", "--profile" = "select portable capability profile", "-h" = "show help", "--help" = "show help" }
option_value_sets = { "--profile" = "profiles" }
value_set = "deps_keys"

[commands.deps]
handler_id = "oooconf.deps"
platforms = ["linux", "macos", "windows"]
description = "install optional dependencies only"
