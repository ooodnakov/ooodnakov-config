[project]
name = "ooodnakov-config"
version = "0.1.0"
description = "Cross-platform dotfiles repository — Python helper scripts for secrets and dependency management"
requires-python = ">=3.12"
dependencies = [
    "windows-curses>=2.4.2; platform_system == 'Windows'",
    "zstandard>=0.23.0 ; sys_platform == 'win32'",
]

[tool.uv]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.11",
    "markdown>=3.11.3",
    "mypy>=2.4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["third_party"]
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=no"
markers = ["integration: isolated cross-platform lifecycle tests"]
