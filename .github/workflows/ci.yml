name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: Test with coverage floor
        run: uv run --python "${{ matrix.python-version }}" pytest --cov=scripts --cov-report=term --cov-fail-under=50

  fleet-validation:
    name: Fleet validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7  # v1
        with:
          bun-version: "1.3.1"
      - name: Install locked dependencies
        working-directory: scripts/fleet
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, and test
        working-directory: scripts/fleet
        run: bun run lint && bun run typecheck && bun run test

  shell-validation:
    name: Shell validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Python lint and format checks
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Install shellcheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shell syntax checks
        run: |
          git ls-files -z '*.sh' ':!:third_party/**' | xargs -0 bash -n
          bash -n bootstrap.sh

      - name: Shellcheck
        run: |
          git ls-files -z '*.sh' ':!:third_party/**' | xargs -0 shellcheck -x --severity=error
          shellcheck -x --severity=error bootstrap.sh

      - name: Validate tracked structured files
        run: uv run python scripts/validation/validate_tracked_formats.py

      - name: Validate lock artifacts are reproducible
        run: |
          uv run python scripts/generate/generate_dependency_lock.py
          uv run python scripts/cli/generate_oooconf_completions.py
          uv run python scripts/cli/generate_cli_reference.py
          git diff --exit-code -- deps.lock.json docs/dependency-lock.md docs/cli-reference.md scripts/cli/oooconf-commands.txt home/.config/ooodnakov/completions/oooconf-completions.ps1 home/.config/ooodnakov/zsh/completions/_oooconf

      - name: Isolated lifecycle integration
        run: uv run pytest tests/test_cross_platform_lifecycle.py

      - name: Managed Neovim/WezTerm config smoke checks
        run: |
          python3 -m json.tool home/.config/nvim/lazy-lock.json > /dev/null
          python3 -m json.tool home/.config/nvim/lazyvim.json > /dev/null

          test -f home/.config/nvim/init.lua
          test -f home/.config/nvim/lua/config/lazy.lua
          test -f home/.config/wezterm/wezterm.lua
          test -f home/.config/wezterm/config/init.lua

      - name: Oooconf smoke tests (install --dry-run, doctor, lock)
        run: |
          bash scripts/setup/ooodnakov.sh install --dry-run --yes-optional

          TEMP_HOME="$(mktemp -d)"
          set +e
          HOME="$TEMP_HOME" XDG_CONFIG_HOME="$TEMP_HOME/.config" bash scripts/setup/ooodnakov.sh doctor
          doctor_status=$?
          set -e
          test "$doctor_status" -ne 0

          bash scripts/setup/ooodnakov.sh lock
          git diff --exit-code deps.lock.json docs/dependency-lock.md

      - name: Optional deps parser/drift tests
        run: |
          uv run pytest tests/test_operation_plan.py tests/test_profiles.py tests/test_transaction_apply.py tests/test_lifecycle_tool.py tests/test_supply_chain.py tests/test_optional_deps.py tests/test_optional_deps_drift.py tests/test_repository_hygiene.py tests/test_static_smoke.py
          bash tests/test_shell.sh

  powershell-validation:
    name: PowerShell validation (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Python lint and format checks
        shell: pwsh
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem "scripts/setup" -Recurse -File -Filter "*.ps1"
            Get-ChildItem "home/.config/ooodnakov/bin" -File -Filter "*.ps1"
            Get-ChildItem "tests" -File -Filter "*.ps1"
          ) | Sort-Object FullName -Unique
          foreach ($script in $scripts) {
            $null = $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($script.FullName)"
            }
            Write-Host "[ok] Parsed $($script.FullName)"
          }

      - name: Validate tracked structured files
        shell: pwsh
        run: uv run python scripts/validation/validate_tracked_formats.py

      - name: Isolated lifecycle integration
        shell: pwsh
        run: uv run pytest tests/test_cross_platform_lifecycle.py

      - name: Managed Neovim/WezTerm config smoke checks
        shell: pwsh
        run: |
          Get-Content "home/.config/nvim/lazy-lock.json" -Raw | ConvertFrom-Json | Out-Null
          Get-Content "home/.config/nvim/lazyvim.json" -Raw | ConvertFrom-Json | Out-Null

          $requiredFiles = @(
            "home/.config/nvim/init.lua",
            "home/.config/nvim/lua/config/lazy.lua",
            "home/.config/wezterm/wezterm.lua",
            "home/.config/wezterm/config/init.lua"
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required managed config file: $path"
            }
            Write-Host "[ok] Found $path"
          }

      - name: Oooconf smoke tests (install --dry-run, doctor, lock)
        shell: pwsh
        run: |
          ./scripts/setup/ooodnakov.ps1 install --dry-run --yes-optional

          $tempHome = Join-Path $env:RUNNER_TEMP "oooconf-smoke-home"
          New-Item -ItemType Directory -Path $tempHome -Force | Out-Null

          $previousHome = $env:HOME
          $previousXdgConfigHome = $env:XDG_CONFIG_HOME
          try {
            $env:HOME = $tempHome
            $env:XDG_CONFIG_HOME = Join-Path $tempHome ".config"

            $doctorFailed = $false
            try {
              ./scripts/setup/ooodnakov.ps1 doctor
            } catch {
              $doctorFailed = $true
              Write-Host "[ok] doctor failed on fresh HOME as expected"
            }

            if (-not $doctorFailed) {
              throw "Expected doctor to fail on fresh HOME, but it succeeded."
            }
          } finally {
            $env:HOME = $previousHome
            if ($null -eq $previousXdgConfigHome) {
              Remove-Item Env:XDG_CONFIG_HOME -ErrorAction SilentlyContinue
            } else {
              $env:XDG_CONFIG_HOME = $previousXdgConfigHome
            }
          }

          ./scripts/setup/ooodnakov.ps1 lock
          uv run python scripts/cli/generate_oooconf_completions.py
          uv run python scripts/cli/generate_cli_reference.py
          git diff --exit-code -- deps.lock.json docs/dependency-lock.md docs/cli-reference.md scripts/cli/oooconf-commands.txt home/.config/ooodnakov/completions/oooconf-completions.ps1 home/.config/ooodnakov/zsh/completions/_oooconf

      - name: Optional deps parser/drift tests
        shell: pwsh
        run: |
          uv run pytest tests/test_operation_plan.py tests/test_profiles.py tests/test_transaction_apply.py tests/test_lifecycle_tool.py tests/test_supply_chain.py tests/test_optional_deps.py tests/test_optional_deps_drift.py tests/test_repository_hygiene.py tests/test_static_smoke.py
