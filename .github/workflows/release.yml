name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build source archives
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          git archive --format=tar.gz --output="dist/ooodnakov-config-${VERSION}.tar.gz" HEAD
          git archive --format=zip --output="dist/ooodnakov-config-${VERSION}.zip" HEAD
          sha256sum dist/*.tar.gz dist/*.zip > dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
