name: Update Dependency Pins

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pins:
    name: Check and update pinned refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Update pinned refs and lock artifacts
        run: uv run python scripts/update/update_pins.py --apply

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pin or lock changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/update-pins"
          git checkout -B "$branch"
          git add scripts/optional-deps.toml deps.lock.json docs/dependency-lock.md docs/imports/upstream-audit.md
          git commit -m "chore(deps): update pinned dependency refs"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore(deps): update pinned dependency refs" \
              --body "Automated weekly pin check and lock artifact refresh via \`scripts/update/update_pins.py --apply\`." \
              --base main \
              --head "$branch"
          fi
