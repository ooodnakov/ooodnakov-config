name: Update Dependency Pins

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pins:
    name: Check and update pinned refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Update pinned refs and lock artifacts
        run: uv run python scripts/update/update_pins.py --apply

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pin or lock changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/update-pins"
          git checkout -B "$branch"
          git add scripts/optional-deps.toml deps.lock.json docs/dependency-lock.md docs/imports/upstream-audit.md
          git commit -m "chore(deps): update pinned dependency refs"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore(deps): update pinned dependency refs" \
              --body "Automated weekly pin check and lock artifact refresh via \`scripts/update/update_pins.py --apply\`." \
              --base main \
              --head "$branch"
          fi
