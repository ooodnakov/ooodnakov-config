name: Fleet Merge

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch for merge"
        type: string
        default: "main"
      apply:
        description: "Actually update and merge eligible PRs (default is preview)"
        type: boolean
        default: false

concurrency:
  group: fleet-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    if: ${{ !inputs.apply }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.1"
      - name: Install fleet dependencies
        working-directory: scripts/fleet
        run: bun install --frozen-lockfile
      - name: Validate and preview
        working-directory: scripts/fleet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
        run: bun run lint && bun run typecheck && bun run test && bun run fleet-merge.ts

  merge:
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install fleet dependencies
        working-directory: scripts/fleet
        run: bun install --frozen-lockfile

      - name: Validate fleet automation
        working-directory: scripts/fleet
        run: bun run lint && bun run typecheck && bun run test

      - name: Merge PRs
        working-directory: scripts/fleet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
          FLEET_MERGE_APPLY: ${{ inputs.apply }}
        run: bun run fleet-merge.ts
