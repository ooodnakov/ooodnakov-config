# Output configuration.
#
# Connector names and modes are machine specific. List the available ones with
# `umbriel outputs`.
#
# Reference: https://docs.noctalia.dev/umbriel/outputs/

[output.HDMI-A-2]
mode = "2560x1440@144"
position = [0, 0]
scale = 1.0
# niri used on-demand variable refresh rate; Umbriel arms it for fullscreen.
vrr = "fullscreen"

[output.DP-1]
mode = "2560x1440@280"
position = [2560, 0]
scale = 1.0
vrr = "fullscreen"

[output.HDMI-A-1]
enabled = false
