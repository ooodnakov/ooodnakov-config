# Layout.
#
# niri scrolls columns horizontally with rows stacked inside each column, which
# is Umbriel's scrolling layout.
#
# Reference: https://docs.noctalia.dev/umbriel/layout/

[layout]
mode = "scrolling"
gap = 12
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"
