# Scratchpad.
#
# niri emulated a scratchpad with a hidden workspace and nscratch; Umbriel has
# native named scratchpads, so the dedicated wezterm instance moves here.
#
# Reference: https://docs.noctalia.dev/umbriel/scratchpads/

[[scratchpad]]
name = "terminal"
spawn_when_empty = "ghostty --class=com.mitchellh.ghostty.scratchpad"

[[window_rule]]
match.app_id = '^com[.]mitchellh[.]ghostty[.]scratchpad$'
default_scratchpad = "terminal"
default_floating = true
default_focused = true

# 80% width, 60% height
default_floating_size = { width = 0.8, height = 0.6 }

# Bottom-centered, 32px above the bottom edge
default_position = { x = 0, y = 32, anchor = "bottom" }
