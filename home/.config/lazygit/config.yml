git:
  diffRenderers:
    - command: delta --dark --paging=never
gui:
  language: en
os:
  editPreset: "nvim"
customCommands:
  - key: "C"
    context: "files"
    description: "Generate commit message with Claude Code"
    command: >-
      d="${TMPDIR:-/tmp}" &&
      f=$(mktemp "${d%/}/lazygit-commit-msg.XXXXXX") &&
      trap 'rm -f "$f"' EXIT &&
      git diff --staged | claude -p 'Generate a concise git commit message for these staged changes. Output ONLY the raw commit message with no markdown, no code blocks, no backticks, no explanations. Use conventional commit format.' --model haiku --output-format text > "$f" &&
      GIT_EDITOR=nvim git commit -e -F "$f"
    output: terminal
